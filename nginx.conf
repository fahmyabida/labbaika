server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Receipt photos from a phone camera run 2-5MB. nginx defaults to 1MB and
    # rejects anything larger with a 413 before it ever reaches Go.
    client_max_body_size 10M;

    # Payslip CSV conversion builds a .docx in-process and can be slow.
    proxy_read_timeout 120s;

    location /api/v1/payslips/ {
        proxy_pass http://payslip-svc:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://cashbook-svc:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploaded receipts are served by cashbook-svc via echo's e.Static.
    location /receipts/ {
        proxy_pass http://cashbook-svc:8080;
        proxy_set_header Host $host;
    }

    # CRA is a single-page app: unknown paths must fall back to index.html or
    # a hard refresh on any route returns 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed CRA assets are immutable. index.html must never be cached, or
    # users keep loading the previous deploy's JS bundle.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
